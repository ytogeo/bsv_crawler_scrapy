aoi_path: inputs/sample_aoi.geojson
sample_interval_m: 50
output_dir: data/images
report_dir: data/reports

crawler:
  provider: baidu
  timeout_seconds: 10
  retry_times: 3
  concurrency: 16

pano_file:
  enabled: true
  workers: 2
  file_type: panorama
  file_spec: full
  tile_zoom: 4
  retry_times: 3

mysql:
  database: streetview

redis:
  key_prefix: streetview

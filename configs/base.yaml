aoi_path: inputs/sample_aoi.geojson
sample_interval_m: 50
output_dir: data/images
report_dir: data/reports

crawler:
  provider: baidu
  timeout_seconds: 10
  retry_times: 3
  concurrency: 16
  mock_seed: true
  mock_metadata: true

assets:
  enabled: true
  workers: 2
  asset_type: panorama
  asset_spec: full
  mock_download: true
  tile_zoom: 4
  tile_cols: 4
  tile_rows: 2
  tile_width: 256
  tile_height: 256
  retry_times: 3

mysql:
  database: streetview

redis:
  key_prefix: streetview


[project]
name = "new-svi-crawler"
version = "0.1.0"
description = "Simplified Scrapy + Redis + MySQL street-view image crawler"
requires-python = ">=3.12"
dependencies = [
  "pillow>=10.0",
  "pymysql>=1.1",
  "pyyaml>=6.0",
  "redis>=5.0",
  "requests>=2.31",
  "scrapy>=2.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
streetview-crawler = "streetview_crawler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
